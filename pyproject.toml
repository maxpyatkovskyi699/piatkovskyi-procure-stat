[project]
name = "procure-stat"
version = "0.1.0"
description = "Аналітична система моніторингу публічних закупівель Prozorro"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.1"
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "import-linter", "mypy"]

[project.scripts]
procure-stat = "procure_stat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.poetry.group.dev.dependencies]
mypy = "^1.9.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_ignores = true
mypy_path = "src"

files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pydantic_settings.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]

[tool.importlinter]
root_package = "procure_stat"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["procure_stat.domain"]
forbidden_modules = ["procure_stat.services", "procure_stat.sources", "procure_stat.cli"]

[[tool.importlinter.contracts]]
name = "Services do not know adapters"
type = "forbidden"
source_modules = ["procure_stat.services"]
forbidden_modules = ["procure_stat.sources", "procure_stat.cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=procure_stat --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/procure_stat"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == '__main__':",
    "pragma: no cover",
    "raise NotImplementedError",
]
fail_under = 70